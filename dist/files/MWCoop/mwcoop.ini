; Reglages de MWCoop. MWCoop.exe les modifie pour vous (onglet COOP) ; les mises a jour gardent vos valeurs.
[Coop]
; Votre nom au-dessus de votre tete
Pseudo=
; hote, invite ou solo (MWCoop.exe le choisit au lancement)
Mode=solo
; Adresse de l'hote (invite)
